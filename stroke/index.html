})();

/* ----------------------------------------------------------------------------
   11) BASE .RIV — upload an existing animation; drawn strokes are merged into
       it on export. Its first frame is shown as a background drawing guide.
   ------------------------------------------------------------------------- */

// Parse a .riv binary: extract ToC, count component-indexed objects (those that
// occupy artboard index slots), extract artboard dimensions, and split the
// object-stream bytes into the component section (before any animation object)
// and the animation section (from the first LinearAnimation onwards).
// This split lets us insert our new stroke objects in the right place.
function parseRivBytes(bytes){
  let pos=0;
  const view=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
  function varuint(){ let r=0,s=0,b; do{b=bytes[pos++]; r|=(b&0x7f)<<s; s+=7;}while(b&0x80); return r>>>0; }
  function u32(){ const v=view.getUint32(pos,true); pos+=4; return v>>>0; }
  function skipVal(code){
    if(code===0) varuint();
    else if(code===1){ const n=varuint(); pos+=n; }
    else pos+=4;
  }
  if(bytes[0]!==0x52||bytes[1]!==0x49||bytes[2]!==0x56||bytes[3]!==0x45)
    throw new Error('not a .riv file');
  pos=4; varuint(); varuint(); varuint();
  const keys=[]; for(let k=varuint();k!==0;k=varuint()) keys.push(k);
  const typeMap=new Map();
  const bitmapWords=[]; for(let i=0;i<Math.ceil(keys.length/4);i++) bitmapWords.push(u32());
  for(let i=0;i<keys.length;i++) typeMap.set(keys[i],(bitmapWords[i>>2]>>((i%4)*2))&3);

  const objStreamStart=pos;
  const COMP=new Set([3,16,6,24,18,47]);
  const ANIM=new Set([31,25,26,30]);
  let componentCount=0, artW=0, artH=0, animSplit=-1, animFps=0, animFrames=0;

  while(pos<bytes.length){
    const objOffset=pos-objStreamStart;
    const typeKey=varuint();
    const isArt=(typeKey===1);
    const isLA=(typeKey===31)&&(animFps===0); // extract fps/duration from first LinearAnimation
    let pk;
    while((pk=varuint())!==0){
      const code=typeMap.get(pk)??0;
      if(isArt && pk===7 && code===2){ artW=view.getFloat32(pos,true); pos+=4; }
      else if(isArt && pk===8 && code===2){ artH=view.getFloat32(pos,true); pos+=4; }
      else if(isLA && pk===56){ animFps=varuint(); }    // fps (uint)
      else if(isLA && pk===57){ animFrames=varuint(); } // duration in frames (uint)
      else skipVal(code);
    }
    if(COMP.has(typeKey)) componentCount++;
    if(ANIM.has(typeKey) && animSplit===-1) animSplit=objOffset;
  }
  const all=bytes.slice(objStreamStart);
  const animDuration=animFps>0?animFrames/animFps:0;
  return {typeMap,componentCount,artW,artH,animDuration,
    compObjBytes:animSplit>=0?all.slice(0,animSplit):all,
    animObjBytes:animSplit>=0?all.slice(animSplit):new Uint8Array(0)};
}

// Lazy canvas-advanced runtime (references grid/rive/ — already vendored there)
let _riveRt=null, _riveRtP=null;
function getRiveRuntime(){
  if(_riveRt) return Promise.resolve(_riveRt);
  if(_riveRtP) return _riveRtP;
  _riveRtP=import('../grid/rive/canvas_advanced.mjs').then(mod=>mod.default({
    locateFile: f=>new URL(f.endsWith('.wasm')?'../grid/rive/rive.wasm':'../grid/rive/'+f, location.href).href
  })).then(rt=>{ _riveRt=rt; return rt; }).catch(e=>{ console.warn('Rive runtime unavailable:',e.message); _riveRtP=null; return null; });
  return _riveRtP;
}

// Load Rive instances for the base .riv. Rendering is synchronous (per-frame
// in drawBaseRiv), so no rAF loop is needed here.
async function startBaseRivAnim(bytes, ref){
  const rive=await getRiveRuntime();
  if(!rive || state.baseRiv!==ref) return; // aborted or runtime unavailable (file://)
  try{
    const {artW,artH}=ref;
    const offscreen=document.createElement('canvas'); offscreen.width=artW; offscreen.height=artH;
    const renderer=rive.makeRenderer(offscreen);
    const file=await rive.load(new Uint8Array(bytes));
    const artboard=file.defaultArtboard();
    let animInst=null;
    try{ const la=artboard.animationByIndex(0); animInst=new rive.LinearAnimationInstance(la,artboard); }catch(_){}
    ref._offscreen=offscreen; ref._renderer=renderer; ref._artboard=artboard; ref._animInst=animInst;
  }catch(e){ console.warn('base .riv preview failed:',e); }
  if(state.baseRiv===ref) renderCanvas(); // replace placeholder with real frame (or re-show placeholder on error)
}

// Render the base .riv at the current playhead position and composite it
// onto the canvas. Shows a labelled placeholder while the runtime is loading
// so the user can see the file is active before the preview is ready.
function drawBaseRiv(){
  if(!state.baseRiv) return;
  const {_animInst,_artboard,_renderer,_offscreen,artW,artH,animDuration,opacity,filename}=state.baseRiv;
  if(!_artboard || !_riveRt){
    // runtime not yet loaded (or unavailable on file://) — tinted overlay as placeholder
    ctx.save();
    ctx.globalAlpha=Math.max(opacity,0.25);
    ctx.fillStyle='rgba(30,30,60,0.6)';
    ctx.fillRect(0,0,state.canvas.w,state.canvas.h);
    ctx.globalAlpha=1;
    ctx.fillStyle='rgba(106,209,255,0.55)';
    const fs=Math.max(8,Math.min(16,state.canvas.w/30,state.canvas.h/20));
    ctx.font=`${fs}px monospace`; ctx.textAlign='center';
    ctx.fillText(`base: ${filename}`,state.canvas.w/2,state.canvas.h/2);
    if(animDuration>0) ctx.fillText(`${animDuration.toFixed(2)}s`,state.canvas.w/2,state.canvas.h/2+fs*1.5);
    ctx.textAlign='left'; ctx.restore();
    return;
  }
  const t=animDuration>0?state.playhead%animDuration:0;
  if(_animInst){ _animInst.time=t; _animInst.apply(1.0); }
  _artboard.advance(0);
  _renderer.clear(); _renderer.save();
  _renderer.align(_riveRt.Fit.contain,_riveRt.Alignment.center,{minX:0,minY:0,maxX:artW,maxY:artH},_artboard.bounds);
  _artboard.draw(_renderer); _renderer.restore();
  const Harr=_renderer.H; for(const fn of Harr) fn(); Harr.length=0;
  ctx.save(); ctx.globalAlpha=opacity;
  ctx.drawImage(_offscreen,0,0,state.canvas.w,state.canvas.h);
  ctx.restore();
}

// Build raw bytes for stroke objects + their animation only (no Backboard/Artboard),
// with object indices starting at indexOffset so they don't collide with the base file.
function buildStrokeBody(strokes, indexOffset, transparency){
  const tr=clamp(transparency,0,1);
  const body=[], toc=new Map(), enc=new TextEncoder();
  const varuint=n=>{ n=n>>>0; do{ let b=n&0x7f; n>>>=7; if(n) b|=0x80; body.push(b); }while(n); };
  const u32le=n=>{ n=n>>>0; body.push(n&0xff,(n>>>8)&0xff,(n>>>16)&0xff,(n>>>24)&0xff); };
  const f32=v=>{ const a=new Uint8Array(4); new DataView(a.buffer).setFloat32(0,v,true); body.push(a[0],a[1],a[2],a[3]); };
  const str=s=>{ const b=enc.encode(s); varuint(b.length); for(const c of b) body.push(c); };
  const obj=typeKey=>varuint(typeKey);
  const end=()=>varuint(0);
  const pUint=(k,v)=>{ toc.set(k,C.uint); varuint(k); varuint(v); };
  const pStr =(k,v)=>{ toc.set(k,C.str);  varuint(k); str(v); };
  const pDbl =(k,v)=>{ toc.set(k,C.dbl);  varuint(k); f32(v); };
  const pColor=(k,v)=>{ toc.set(k,C.color); varuint(k); u32le(v); };

  let aEnd=0.1;
  for(const s of strokes){
    aEnd=Math.max(aEnd, s.timelineStart+s.timelineDuration);
    if(!s.holdToEnd) aEnd=Math.max(aEnd, s.timelineStart+s.timelineDuration+(s.holdDuration||0));
  }
  const sEnd=s=>s.holdToEnd?aEnd:s.timelineStart+s.timelineDuration+(s.holdDuration||0);
  const durFrames=Math.max(1,Math.ceil(aEnd*FPS));
  const meta=[];
  let next=indexOffset;

  strokes.map((st,si)=>({st,si})).reverse().forEach(({st,si})=>{
    const c=centroid(st);
    const SHAPE=next++;
    obj(T.Shape); pStr(P.name,`Stroke_${si+1}`); pUint(P.parentId,0); pDbl(P.opacity,1); end();
    const PATH=next++;
    obj(T.PointsPath); pUint(P.parentId,SHAPE); end();
    const knots=knotsFromSegments(st.segments);
    let bx0=Infinity,by0=Infinity,bx1=-Infinity,by1=-Infinity;
    for(const k of knots){ bx0=Math.min(bx0,k.p.x); by0=Math.min(by0,k.p.y); bx1=Math.max(bx1,k.p.x); by1=Math.max(by1,k.p.y); }
    const nudgeW=(bx1-bx0)<0.1, nudgeH=(by1-by0)<0.1;
    knots.forEach((k,ki)=>{
      next++;
      const last=ki===knots.length-1;
      obj(T.CubicVertex);
        pUint(P.parentId,PATH);
        pDbl(P.vx,k.p.x+(last&&nudgeW?0.12:0)); pDbl(P.vy,k.p.y+(last&&nudgeH?0.12:0));
        pDbl(P.inRot,k.inRot); pDbl(P.inDist,k.inDist);
        pDbl(P.outRot,k.outRot); pDbl(P.outDist,k.outDist);
      end();
    });
    const STROKE=next++;
    obj(T.Stroke); pUint(P.parentId,SHAPE); pDbl(P.thickness,st.thickness??4); pUint(P.cap,1); pUint(P.join,1); end();
    next++;
    obj(T.SolidColor); pUint(P.parentId,STROKE); pColor(P.color,hexToRiveColor(st.colour)); end();
    const TRIM=next++;
    obj(T.TrimPath); pUint(P.parentId,STROKE); pDbl(P.trimStart,0); pDbl(P.trimEnd,0); pDbl(P.trimOffset,0); pUint(P.trimMode,1); end();
    meta.push({st,c,SHAPE,TRIM});
  });

  obj(T.LinearAnimation);
    pStr(P.animName,'Strokes'); pUint(P.fps,FPS); pUint(P.duration,durFrames); pUint(P.loop,1);
  end();

  const kf=(frame,val)=>{ obj(T.KeyFrameDouble); pUint(P.frame,frame); pUint(P.interp,1); pDbl(P.value,val); end(); };
  const keyedProp=(propKey,frames)=>{ obj(T.KeyedProperty); pUint(P.propertyKey,propKey); end(); strictlyIncreasing(frames).forEach(([f,v])=>kf(f,v)); };

  meta.forEach(m=>{
    const st=m.st;
    const fStart=Math.round(st.timelineStart*FPS);
    const fDraw =Math.round((st.timelineStart+st.timelineDuration)*FPS);
    const fEnd  =Math.round(sEnd(st)*FPS);
    obj(T.KeyedObject); pUint(P.objectId,m.TRIM); end();
      const ease=st.easing||[0,0,1,1], trimK=[];
      const STEPS=easeEq(ease,[0,0,1,1])?1:14;
      for(let i=0;i<=STEPS;i++) trimK.push([Math.round(lerp(fStart,Math.max(fDraw,fStart+1),i/STEPS)),easeY(ease,i/STEPS)]);
      keyedProp(P.trimEnd,trimK);
    obj(T.KeyedObject); pUint(P.objectId,m.SHAPE); end();
      const opK=[[fStart,tr],[fEnd,tr]];
      if(fEnd<durFrames) opK.push([fEnd+1,0]);
      keyedProp(P.opacity,opK);
      const drift=Math.abs(st.offsetStart.x-st.offsetEnd.x)>0.01||Math.abs(st.offsetStart.y-st.offsetEnd.y)>0.01;
      if(drift){
        keyedProp(P.x,[[fStart,st.offsetStart.x-m.c.x],[Math.max(fEnd,fStart+1),st.offsetEnd.x-m.c.x]]);
        keyedProp(P.y,[[fStart,st.offsetStart.y-m.c.y],[Math.max(fEnd,fStart+1),st.offsetEnd.y-m.c.y]]);
      }
  });
  return {body,toc};
}

// Write a combined .riv: base file's component objects, then our new stroke objects,
// then base file's animation objects, then our new animation — all under one merged ToC.
// The base artboard (index 0) becomes the shared artboard; our shapes parent to it.
function exportRivCombined(base, strokes, transparency){
  const {typeMap:baseToc, componentCount, compObjBytes, animObjBytes}=base;
  const {body, toc:newToc}=buildStrokeBody(strokes, componentCount+1, transparency);
  const merged=new Map(baseToc);
  for(const [k,v] of newToc) merged.set(k,v);
  const head=[];
  const hVar=n=>{ n=n>>>0; do{ let b=n&0x7f; n>>>=7; if(n) b|=0x80; head.push(b); }while(n); };
  const hU32=n=>{ n=n>>>0; head.push(n&0xff,(n>>>8)&0xff,(n>>>16)&0xff,(n>>>24)&0xff); };
  head.push(0x52,0x49,0x56,0x45); hVar(7); hVar(0); hVar(RIVE_FILE_ID);
  const keys=[...merged.keys()].sort((a,b)=>a-b);
  for(const k of keys) hVar(k);
  hVar(0);
  let word=0;
  for(let i=0;i<keys.length;i++){
    word|=(merged.get(keys[i])&3)<<((i%4)*2);
    if(i%4===3){ hU32(word); word=0; }
  }
  if(keys.length%4!==0) hU32(word);
  const bodyArr=new Uint8Array(body);
  const out=new Uint8Array(head.length+compObjBytes.length+bodyArr.length+animObjBytes.length);
  let off=0;
  out.set(new Uint8Array(head),off); off+=head.length;
  out.set(compObjBytes,off);         off+=compObjBytes.length;
  out.set(bodyArr,off);              off+=bodyArr.length;
  out.set(animObjBytes,off);
  return out;
}

function syncBaseRivUI(){
  const has=!!state.baseRiv;
  const btn=document.getElementById('baseRivBtn'), ctl=document.getElementById('baseRivCtl');
  if(btn) btn.style.display=has?'none':'';
  if(ctl) ctl.style.display=has?'':'none';
  if(has){
    const nm=document.getElementById('baseRivName'); if(nm) nm.textContent=state.baseRiv.filename;
    const pct=Math.round(state.baseRiv.opacity*100);
    const ro=document.getElementById('baseRivOpacity'), rv=document.getElementById('baseRivOpacityVal');
    if(ro) ro.value=pct; if(rv) rv.textContent=pct+'%';
  }
}

(function wireBaseRiv(){
  const input=document.getElementById('baseRivInput');
  const btn=document.getElementById('baseRivBtn');
  const clearBtn=document.getElementById('baseRivClear');
  const opSlider=document.getElementById('baseRivOpacity');
  const opVal=document.getElementById('baseRivOpacityVal');
  if(!input||!btn) return;
  btn.onclick=()=>input.click();
  input.onchange=async e=>{
    const file=e.target.files[0]; if(!file) return;
    input.value='';
    let bytes;
    try{ bytes=new Uint8Array(await file.arrayBuffer()); }catch{ alert('Could not read file.'); return; }
    let parsed;
    try{ parsed=parseRivBytes(bytes); }catch(err){ alert('Not a valid .riv file: '+err.message); return; }
    const {typeMap,componentCount,artW,artH,animDuration,compObjBytes,animObjBytes}=parsed;
    if(artW>0&&artH>0) applyCanvasSize(artW,artH);
    const prev=state.baseRiv;
    state.baseRiv={filename:file.name,typeMap,componentCount,compObjBytes,animObjBytes,animDuration,
      artW:artW||state.canvas.w, artH:artH||state.canvas.h,
      opacity:prev?.opacity??0.5,
      _animInst:null,_artboard:null,_renderer:null,_offscreen:null};
    syncBaseRivUI(); renderCanvas(); renderTimeline();
    startBaseRivAnim(bytes, state.baseRiv);
  };
  if(clearBtn) clearBtn.onclick=()=>{ state.baseRiv=null; syncBaseRivUI(); renderCanvas(); renderTimeline(); };
  if(opSlider) opSlider.oninput=e=>{
    const v=clamp(+e.target.value/100,0.1,1);
    if(state.baseRiv) state.baseRiv.opacity=v;
    if(opVal) opVal.textContent=e.target.value+'%';
    renderCanvas();
  };
})();

/* ----------------------------------------------------------------------------
   bootstrap
   ------------------------------------------------------------------------- */
function renderAll(){ renderCanvas(); renderEasing(); renderTimeline(); renderGroups(); renderTabs(); }
function onResize(){ fitCanvas(); renderAll(); }
window.addEventListener('resize', onResize);
setTool('draw');
updateUndoButtons();
fitCanvas();
renderTabs();
renderPalette();
renderAll();
</script>
