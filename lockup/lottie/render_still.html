<!DOCTYPE html>
<html><head><meta charset="utf-8"/>
<style>html,body{margin:0;background:#ff00ff}#c{width:1440px;height:1440px}</style>
</head><body>
<div id="c"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script>
(async () => {
  const src = new URLSearchParams(location.search).get('src') || 'export/mascot_f0217_still.json';
  const res = await fetch(src);
  const animationData = await res.json();
  const anim = lottie.loadAnimation({
    container: document.getElementById('c'),
    renderer: 'svg',
    loop: false,
    autoplay: false,
    animationData,
  });
  await new Promise(r => anim.addEventListener('DOMLoaded', r));
  anim.goToAndStop(0, true);
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  document.documentElement.setAttribute('data-ready', '1');
  document.title = 'READY';
})();
</script>
</body></html>
